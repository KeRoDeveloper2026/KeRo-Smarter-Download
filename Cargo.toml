[workspace]
resolver = "2"
members = ["crates/engine", "crates/app"]

[workspace.package]
version = "1.1.4"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
