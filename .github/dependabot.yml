version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Africa/Cairo
    open-pull-requests-limit: 4
    labels: [dependencies]
    groups:
      rust-compatible:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Africa/Cairo
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      workflow-actions:
        patterns: ['*']
