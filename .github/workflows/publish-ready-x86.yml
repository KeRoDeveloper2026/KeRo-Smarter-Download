          lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          packages = {(p['name'], p['version']) for p in lock['package']}
          missing = sorted(set(map(tuple, baseline)) - packages)
          if missing:
              raise RuntimeError('Successful Windows dependency versions changed: ' + repr(missing))
          print('All', len(baseline), 'recorded Windows dependency versions retained.')
          pathlib.Path('lock-provenance.json').write_text(json.dumps({'source_run': 40833335595, 'source_jobs': [123312372137, 123312372343], 'recorded_windows_versions_retained': len(baseline), 'total_packages': len(packages), 'note': 'Reconstructed using current manifests and compared with recorded Windows downloads. The original complete lockfile was not archived; unrecorded target-only dependencies are not asserted identical.'}, indent=2) + '\n')
