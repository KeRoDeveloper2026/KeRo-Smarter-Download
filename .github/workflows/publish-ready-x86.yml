            Cargo.lock.sha256
            lock-provenance.json
          if-no-files-found: error

  win7:
    needs: resolve
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-win7-windows-msvc
            arch: x86_64
            platform: Win7-x64
          - target: i686-win7-windows-msvc
            arch: x86
            platform: Win7-x86
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Verified-Cargo-Lock
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-10-29
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: platform-${{ matrix.platform }}-${{ hashFiles('tools/prepare-win7.py') }}
          cache-on-failure: true
      - name: Build and test Windows 7 target without changing the lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $before = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash
          cargo fetch --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency fetch failed' }
          $cargoRoot = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $package = if ('${{ matrix.arch }}' -eq 'x86') { 'windows_i686_msvc' } else { 'windows_x86_64_msvc' }
          $imports = (Resolve-Path "$cargoRoot/registry/src/*/$package-0.48.5/lib" | Select-Object -First 1).Path
          if (-not $imports) { throw 'Legacy import libraries missing' }
          python tools/prepare-win7.py --cargo-root "$cargoRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Verified Windows 7 compatibility patch failed' }
          $env:CARGO_ENCODED_RUSTFLAGS = "-C$([char]31)target-feature=+crt-static$([char]31)-Lnative=$imports$([char]31)--cfg$([char]31)windows_slim_errors"
          cargo build --locked --release --target ${{ matrix.target }} -Z build-std=std,panic_abort --features legacy-win7
          if ($LASTEXITCODE -ne 0) { throw 'Locked application build failed' }
          python tools/check-win7-imports.py target/${{ matrix.target }}/release/KeRoDownload.exe
          if ($LASTEXITCODE -ne 0) { throw 'Known post-Windows-7 import detected' }
          cargo test --locked -p swiftget-engine --target ${{ matrix.target }} -Z build-std=std,panic_abort --features legacy-win7
          if ($LASTEXITCODE -ne 0) { throw 'Locked engine tests failed' }
          if ((Get-FileHash Cargo.lock -Algorithm SHA256).Hash -ne $before) { throw 'Cargo.lock changed during verification' }
          "Locked build, import check and engine tests passed. Lock SHA256: $before" | Out-File locked-${{ matrix.platform }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Locked-Verification-${{ matrix.platform }}
          path: locked-${{ matrix.platform }}.txt
