["rustls","0.23.46"],["rustversion","1.0.23"],["ryu","1.0.23"],["schannel","0.1.30"],["scoped-tls-hkt","0.1.5"],["scopeguard","1.2.0"],["semver","1.0.28"],["serde_core","1.0.229"],["serde_derive","1.0.229"],["serde_json","1.0.154"],["serde_spanned","1.1.2"],["serde_urlencoded","0.7.1"],["serde","1.0.229"],["sha2","0.10.9"],["shlex","1.3.0"],["shlex","2.0.1"],["simd-adler32","0.3.10"],["simdutf8","0.1.5"],["simplecss","0.2.2"],["siphasher","1.0.4"],["skia-bindings","0.153.3"],["skia-safe","0.153.3"],["skrifa","0.44.0"],["slab","0.4.12"],["slint-build","1.18.1"],["slint-macros","1.18.1"],["slint","1.18.1"],["slotmap","1.1.1"],["smallvec","1.16.4"],["smol_str","0.2.2"],["smol_str","0.3.7"],["snafu-derive","0.8.9"],["snafu","0.8.9"],["socket2","0.6.5"],["softbuffer","0.4.8"],["spin_on","0.1.1"],["spirv","0.4.0+sdk-1.4.341.0"],["stable_deref_trait","1.2.1"],["static_assertions","1.1.0"],["strict-num","0.1.1"],["strum_macros","0.28.0"],["strum","0.28.0"],["subtle","2.6.1"],["svgtypes","0.16.1"],["swash","0.2.10"],["syn","2.0.119"],["syn","3.0.9"],["sync_wrapper","1.0.2"],["synstructure","0.14.0"],["sys-locale","0.3.2"],["taffy","0.10.1"],["tar","0.4.46"],["text-size","1.1.1"],["thiserror-impl","1.0.69"],["thiserror-impl","2.0.21"],["thiserror","1.0.69"],["thiserror","2.0.21"],["tiny_http","0.12.0"],["tiny-skia-path","0.12.0"],["tiny-skia","0.12.0"],["tinystr","0.8.5"],["tinyvec","1.13.3"],["tokio-macros","2.7.2"],["tokio-native-tls","0.3.1"],["tokio-rustls","0.26.6"],["tokio-util","0.7.20"],["tokio","1.54.1"],["toml_datetime","1.1.2+spec-1.1.0"],["toml_edit","0.25.17+spec-1.1.0"],["toml_parser","1.1.5+spec-1.1.0"],["toml_writer","1.1.3+spec-1.1.0"],["toml","1.1.8+spec-1.1.0"],["tower-http","0.6.11"],["tower-layer","0.3.3"],["tower-service","0.3.3"],["tower","0.5.3"],["tracing-attributes","0.1.31"],["tracing-core","0.1.36"],["tracing","0.1.44"],["tray-icon","0.19.3"],["try-lock","0.2.5"],["typed-index-collections","3.5.0"],["typenum","1.20.1"],["unicase","2.10.0"],["unicod