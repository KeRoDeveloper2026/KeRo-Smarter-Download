name: Verify pinned Cargo dependencies

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-ready-x86.yml]

permissions:
  contents: read

jobs:
  resolve:
    if: github.event.head_commit.message == 'Generate and verify Cargo lockfile against successful Windows builds'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-10-29
      - name: Generate lockfile and compare recorded successful Windows versions
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          python <<'PY'
