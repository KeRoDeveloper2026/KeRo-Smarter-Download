name: Inspect CI quality checks

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-ready-x86.yml]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect formatting and lint checks without changing application behavior'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: quality-inspection
          cache-on-failure: true
      - name: Format sources and collect Clippy diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --version | Out-File rust-version.txt
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          git -c core.autocrlf=false diff --binary --output=format.patch
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatted sources failed validation' }
          cargo clippy --locked --workspace --all-targets --message-format=json 1> clippy.json
          $code = $LASTEXITCODE
          "Clippy exit: $code" | Out-File clippy-exit.txt
          exit $code
      - name: Test formatted engine sources
        run: cargo test --locked -p swiftget-engine --no-fail-fast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Quality-Inspection
          path: |
            format.patch
            clippy.json
            clippy-exit.txt
            rust-version.txt
          if-no-files-found: error
