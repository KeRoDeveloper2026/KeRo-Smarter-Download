name: Resume v1.1.4 publication from signed checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resume-v1.1.4.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-approved-v1.1.4
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 40959334297
          artifact-ids: 12935930431
          path: dist
      - name: Continue only publication using the retained signed files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/promote-tested-release.ps1 -Phase Publish
