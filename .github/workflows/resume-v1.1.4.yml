name: Resume v1.1.4 publication from signed checkpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resume-v1.1.4.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-approved-v1.1.4
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 40959334297
          artifact-ids: 12935930431
          merge-multiple: true
          path: dist
      - name: Continue only publication using the retained signed files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/promote-tested-release.ps1 -Phase Publish
