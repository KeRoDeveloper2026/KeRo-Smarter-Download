name: Browser extension packages

on:
  push:
    branches: [main]
    paths:
      - extension/**
      - extension-firefox/**
      - tools/package-extensions.py
      - docs/BROWSERS.md
      - .github/workflows/extension-packages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-package-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Chromium and Firefox behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/content.js
          node --check extension/background.js
          node extension/test/compat.test.js
          node extension/test/yt-core.test.js
          node extension/test/background.sim.js
          node extension/test/background.sim.js --firefox
          for scenario in throw missing-id reject last-error; do
            node extension/test/content.sim.js --invalidated="$scenario"
            node extension/test/content.sim.js --firefox --invalidated="$scenario"
          done
      - name: Package all desktop browser variants
        run: python tools/package-extensions.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: KeRo-Browser-Extensions
          path: dist-extensions/*
      - name: Add extension packages to current app release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python -c 'import tomllib; print("v" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY"
          # Existing application installers and update manifests are not replaced.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > release-assets.json
          for file in dist-extensions/*; do
            name="$(basename "$file")"
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' release-assets.json)"
            if [ "$count" -ne 0 ]; then
              expected="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
              actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' release-assets.json)"
              if [ "$count" -ne 1 ] || [ "$actual" != "$expected" ]; then
                echo "::error::Existing asset differs: $name. Bump the extension version instead of replacing it."
                exit 1
              fi
              echo "Retaining existing identical asset: $name"
              continue
            fi
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
          done
