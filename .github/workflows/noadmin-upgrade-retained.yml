name: Upgrade checks for retained no-admin installers - no rebuild
on:
  push:
    branches: [preview/noadmin-static-runtime]
    paths: [.github/workflows/noadmin-upgrade-retained.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Win10_11-x64
            candidate_run: 41197129049
          - platform: Win10_11-x86
            candidate_run: 41198482590
          - platform: Win7-x64
            candidate_run: 41198044080
          - platform: Win7-x86
            candidate_run: 41198835486
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: noadmin-app-${{ matrix.platform }}
          run-id: 41197129049
          github-token: ${{ github.token }}
          path: build-cache/stage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: noadmin-candidate-${{ matrix.platform }}
          run-id: ${{ matrix.candidate_run }}
          github-token: ${{ github.token }}
          path: dist
      - name: Existing upgrade preservation test against v1.1.3
        shell: pwsh
        run: ./tools/test-installer-upgrade.ps1 -Platform '${{ matrix.platform }}'
      - name: Uninstall and preserve user data under runner account
        shell: pwsh
        run: |
          $dataDir=Join-Path $env:APPDATA 'KeRo/KeRoDownload/data'
          $paths=@((Join-Path $dataDir 'settings.json'),(Join-Path $dataDir 'downloads.json'),(Join-Path $env:RUNNER_TEMP 'download-canary.part'))
          $hashes=@{};foreach($path in $paths){$hashes[$path]=(Get-FileHash $path).Hash}
          $uninstall=Join-Path $env:RUNNER_TEMP 'KeRo-upgrade-test/unins000.exe'
          $p=Start-Process $uninstall -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru
          if(-not $p.WaitForExit(90000)){throw 'Uninstaller timeout'}
          if($p.ExitCode -ne 0){throw 'Uninstaller failed'}
          foreach($path in $paths){if(-not(Test-Path $path) -or (Get-FileHash $path).Hash -ne $hashes[$path]){throw 'Uninstall changed retained user data'}}
          'PASS under GitHub runner account: uninstall preserved settings/history/partial bytes. Standard-user interactive test remains unverified because hosted secondary-account known folders were unavailable.' | Set-Content 'dist/UNINSTALL-${{ matrix.platform }}.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: noadmin-upgrade-verified-${{ matrix.platform }}
          path: |
            dist/UPGRADE-*.txt
            dist/UNINSTALL-*.txt
          if-no-files-found: ignore
          retention-days: 14
