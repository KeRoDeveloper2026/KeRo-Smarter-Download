name: Quality checks

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - crates/**
      - extension/**
      - extension-firefox/**
      - tools/**
      - .github/workflows/**
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  formatting:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  browser-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: node tools/test-extensions.mjs
      - run: python tools/package-extensions.py

  rust-checks:
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: quality-inspection
          cache-on-failure: true
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Parse PowerShell build scripts without executing them
        shell: pwsh
        run: |
          foreach ($path in @('build-windows.ps1', 'tools/package-platform.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$path has PowerShell syntax errors" }
          }
      - run: cargo test --locked -p swiftget-engine --no-fail-fast

  win7-dependency-guard:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-10-29
      - run: cargo fetch --locked --target x86_64-win7-windows-msvc
      - name: Verify the Windows 7 compatibility sources
        run: python tools/prepare-win7.py --cargo-root "$HOME/.cargo"

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: audit-0.22.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
