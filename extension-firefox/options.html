<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KeRo Smarter Download - Settings</title>
<style>
  :root { color-scheme: dark; }
  select, input[type=number] { background: #0a1b33; color: #eaf4ff; }
  h2 { color: #fff; }
  body { font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: #eaf4ff; margin: 0; padding: 18px 22px; min-width: 420px; background: #071526; }
  h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 18px; }
  h2 img { width: 28px; height: 28px; }
  .card { background: #0b1f3a; border-radius: 10px; padding: 12px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  label { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  select { padding: 3px 6px; border: 1px solid #1d4580; border-radius: 6px; font: inherit; }
  input[type=number] { width: 90px; padding: 4px 8px; border: 1px solid #1d4580; border-radius: 6px; font: inherit; }
  input[type=range] { flex: 1; accent-color: #2fb4ff; }
  output { min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  .saved { color: #1a9e5a; font-size: 12px; height: 16px; margin-top: 8px; }
</style>
</head>
<body>
  <h2><img src="icons/icon48.png" alt="">KeRo Smarter Download — Settings</h2>
  <div class="card">
    <label><input type="checkbox" id="intercept"> Send browser downloads to KeRo Smarter Download</label>
    <label><input type="checkbox" id="allFiles"> Capture all file types (keep site and bypass-key exclusions)</label>
    <label>Ignore files smaller than <input type="number" id="minSize" min="0"> KB</label>
    <label>App port <input type="number" id="port" min="1024" max="65535"></label>
    <label>Size of the "Download this video" button
      <input type="range" id="bubbleScale" min="50" max="200" step="5" value="100">
      <output id="bubbleScaleText">100%</output>
    </label>
  </div>
  <div class="saved" id="saved"></div>
  <script src="compat.js"></script>
<script src="options.js"></script>
</body>
</html>
